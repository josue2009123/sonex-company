services:
  - type: web
    name: sonex
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RP_ID
        sync: false
      - key: DB_PATH
        value: /tmp/sonex.db
      - key: SECURE_COOKIES
        value: "1"
